[package]
name = "tui-nuances-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ratatui = { version = "0.30", default-features = false }
serde_json = "1"
tui-nuances = { path = "..", features = ["serde"] }

# Not part of the main crate (needs nightly).
[workspace]

[[bin]]
name = "theme_json"
path = "fuzz_targets/theme_json.rs"
test = false
doc = false

[[bin]]
name = "from_base"
path = "fuzz_targets/from_base.rs"
test = false
doc = false

[[bin]]
name = "color_math"
path = "fuzz_targets/color_math.rs"
test = false
doc = false

[[bin]]
name = "name_lookup"
path = "fuzz_targets/name_lookup.rs"
test = false
doc = false
